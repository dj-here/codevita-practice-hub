version: '3.8'

services:
  # Application Database (PostgreSQL)
  codevita-db:
    image: postgres:16-alpine
    container_name: codevita-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codevita_hub
    ports:
      - '5432:5432'
    volumes:
      - codevita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Judge0 Queue and Rate Limiting
  codevita-redis:
    image: redis:7-alpine
    container_name: codevita-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - codevita_redisdata:/data

  # Judge0 Sandbox Database
  judge0-db:
    image: postgres:16-alpine
    container_name: judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U judge0']
      interval: 5s
      timeout: 5s
      retries: 5

  # Judge0 Server API
  judge0-server:
    image: judge0/judge0:latest
    container_name: judge0-server
    restart: unless-stopped
    ports:
      - '2358:2358'
    environment:
      - REDIS_HOST=codevita-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    depends_on:
      judge0-db:
        condition: service_healthy
      codevita-redis:
        condition: service_started

  # Judge0 Worker (Code Execution Engine)
  judge0-worker:
    image: judge0/judge0:latest
    container_name: judge0-worker
    restart: unless-stopped
    privileged: true
    environment:
      - REDIS_HOST=codevita-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    depends_on:
      judge0-db:
        condition: service_healthy
      codevita-redis:
        condition: service_started

  # Next.js Web Application
  codevita-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codevita-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@codevita-db:5432/codevita_hub?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=codevita-hub-production-secure-key-32-chars
      - JUDGE0_API_URL=http://judge0-server:2358
      - NODE_ENV=production
    depends_on:
      codevita-db:
        condition: service_healthy

volumes:
  codevita_pgdata:
  codevita_redisdata:
  judge0_pgdata:
